{% extends "base.html" %}
{% block title %}Sign up – {{ settings.app_name }}{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold">Create account</h1>
      <p class="text-slate-500 dark:text-slate-400 mt-1">Start generating in minutes</p>
    </div>
    <form id="reg-form" class="space-y-5 p-8 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xl">
      <div>
        <label class="block text-sm font-medium mb-1.5">Name</label>
        <input type="text" name="name" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-brand outline-none transition" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5">Email</label>
        <input type="email" name="email" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-brand outline-none transition" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5">Password</label>
        <input type="password" name="password" required minlength="6" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-brand outline-none transition" />
      </div>
      <button type="submit" class="w-full btn-brand py-2.5 rounded-xl font-semibold">Create account</button>
      <p class="text-center text-sm text-slate-500">Already have an account? <a href="/login" class="text-brand font-medium hover:underline">Log in</a></p>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('reg-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const data = await API.post('/api/auth/register', {
      name: fd.get('name'),
      email: fd.get('email'),
      password: fd.get('password'),
    });
    setAuth(data.token, data.user);
    toast('Account created', 'success');
    location.href = '/generate';
  } catch (err) {
    toast(err.message || 'Registration failed', 'error');
  }
});
</script>
{% endblock %}
