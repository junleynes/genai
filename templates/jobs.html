{% extends "base.html" %}
{% block title %}Jobs – {{ settings.app_name }}{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-10">
  <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
    <div>
      <h1 class="text-3xl font-bold tracking-tight">Jobs</h1>
      <p class="text-slate-500 dark:text-slate-400 mt-1">Your generation queue and history</p>
    </div>
    <a href="/generate" class="btn-brand px-4 py-2 rounded-xl text-sm font-semibold">New generation</a>
  </div>
  <div id="jobs-list" class="space-y-4">
    <p class="text-slate-500">Loading…</p>
  </div>
</div>

<!-- Job detail drawer -->
<div id="job-drawer" class="hidden fixed inset-0 z-50">
  <div class="absolute inset-0 bg-black/60" onclick="closeDetails()"></div>
  <div class="absolute right-0 inset-y-0 w-full max-w-lg bg-white dark:bg-slate-900 shadow-2xl overflow-y-auto">
    <div id="job-drawer-body" class="p-6"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let JOBS = [];
if (!requireAuth()) throw new Error('auth');

function statusBadge(s) {
  const map = {
    queued: 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300',
    processing: 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300',
    completed: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300',
    failed: 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300',
    cancelled: 'bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300',
    canceled: 'bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300',
  };
  return `<span class="text-xs font-semibold px-2 py-0.5 rounded-full ${map[s] || map.queued}">${s}</span>`;
}

function modelLabel(j) {
  const p = j.params || {};
  const mt = p.model_type || p.model || '';
  if (!mt || mt === 'auto') return 'Auto / default';
  return mt;
}

function paramChips(j) {
  const p = j.params || {};
  const chips = [];
  chips.push(j.job_type || '?');
  if (j.mode) chips.push(j.mode);
  chips.push('model: ' + modelLabel(j));
  if (p.resolution) chips.push(String(p.resolution));
  if (p.steps) chips.push(p.steps + ' steps');
  if (p.duration_seconds) chips.push(p.duration_seconds + 's');
  if (p.guidance_scale) chips.push('cfg ' + p.guidance_scale);
  if (p.seed !== undefined && p.seed !== null && Number(p.seed) !== -1) chips.push('seed ' + p.seed);
  if (j.backend) chips.push(j.backend);
  return chips.filter(Boolean).map(c =>
    `<span class="inline-flex px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-[11px] text-slate-600 dark:text-slate-300 font-mono">${escapeHtml(String(c))}</span>`
  ).join(' ');
}

async function loadJobs() {
  const el = document.getElementById('jobs-list');
  try {
    const jobs = await API.get('/api/jobs');
    JOBS = jobs;
    if (!jobs.length) {
      el.innerHTML = '<p class="text-slate-500">No jobs yet. <a href="/generate" class="text-brand underline">Create one</a>.</p>';
      return;
    }
    el.innerHTML = jobs.map(j => `
      <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800" data-id="${j.id}" data-status="${escapeHtml(j.status)}">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-2 mb-1">
              ${statusBadge(j.status)}
              <span class="text-xs text-slate-400">${new Date(j.created_at).toLocaleString()}</span>
            </div>
            <h3 class="font-semibold truncate">${escapeHtml(j.title || j.prompt)}</h3>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">${escapeHtml(j.prompt)}</p>
            <div class="flex flex-wrap gap-1.5 mt-3">${paramChips(j)}</div>
            ${j.owner_email ? `<p class="text-xs text-slate-400 mt-2">Owner: ${escapeHtml(j.owner_name || '')} (${escapeHtml(j.owner_email)})</p>` : ''}
          </div>
          <div class="flex flex-wrap items-center gap-2">
            ${j.status === 'processing' || j.status === 'queued' ? `
              <div class="w-28">
                <div class="h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                  <div class="progress-bar h-full bg-brand rounded-full" style="width:${j.progress || 0}%"></div>
                </div>
                <p class="text-[10px] text-slate-400 mt-0.5 text-right">${j.progress || 0}%</p>
              </div>
              <button type="button" onclick="cancelJob('${j.id}')" class="text-sm px-3 py-1.5 rounded-lg border border-amber-500 text-amber-700 dark:text-amber-300 hover:bg-amber-50 dark:hover:bg-amber-950/30 font-medium">Cancel</button>
              ` : ''}
            ${j.result_url && j.status === 'completed' ? `
              <a href="${j.result_url}" target="_blank" rel="noopener" class="text-sm px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800">Open result</a>
            ` : ''}
            ${(j.status === 'failed' || j.status === 'cancelled' || j.status === 'canceled') ? `
              <button type="button" onclick="retryJob('${j.id}')" class="text-sm px-3 py-1.5 rounded-lg bg-brand text-white hover:opacity-90 font-medium">Retry</button>
            ` : ''}
            <button type="button" onclick="showDetails('${j.id}')" class="text-sm px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800">Details</button>
            ${j.status === 'completed' ? `
              <button type="button" onclick="reuseJob('${j.id}')" class="text-sm px-3 py-1.5 rounded-lg border border-brand text-brand hover:bg-brand/5 font-medium">Reuse</button>
            ` : ''}
            <button type="button" onclick="deleteJob('${j.id}')" class="text-sm px-3 py-1.5 rounded-lg text-red-600 hover:bg-red-50 dark:hover:bg-red-950/30">Delete</button>
          </div>
        </div>
        ${j.status === 'cancelled' || j.status === 'canceled' ? `<div class="mt-3 p-3 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-600 dark:text-slate-300">
          <div class="font-semibold mb-1">Cancelled</div>
          <div>${escapeHtml(j.error || 'Cancelled by user')}</div>
        </div>` : (j.status === 'failed' || j.error) ? `<div class="mt-3 p-3 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900 text-sm text-red-700 dark:text-red-300">
          <div class="font-semibold mb-1">Generation failed</div>
          <div class="whitespace-pre-wrap break-words">${escapeHtml(j.error || 'Unknown error')}</div>
        </div>` : ''}
        ${j.result_url && j.status === 'completed' ? `
          <div class="mt-4">
            ${/\.(mp4|webm|mov)(\?|$)/i.test(j.result_url) || (j.job_type && j.job_type.includes('2v') && !j.job_type.includes('2i'))
              ? `<video src="${j.result_url}" controls class="rounded-xl max-h-56 w-full bg-black border border-slate-200 dark:border-slate-700"></video>`
              : `<img src="${j.result_url}" alt="Result" class="rounded-xl max-h-56 object-contain border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950" />`
            }
          </div>
        ` : ''}
      </div>
    `).join('');
  } catch (err) {
    el.innerHTML = `<p class="text-red-500">${escapeHtml(err.message)}</p>`;
  }
}

async function cancelJob(id) {
  if (!confirm('Cancel this job?')) return;
  try {
    await API.post('/api/jobs/' + id + '/cancel', {});
    toast('Job cancelled', 'success');
    loadJobs();
  } catch (err) {
    toast(err.message, 'error');
  }
}

async function retryJob(id) {
  try {
    await API.post('/api/jobs/' + id + '/retry', {});
    toast('Job re-queued', 'success');
    loadJobs();
  } catch (err) {
    toast(err.message, 'error');
  }
}

async function deleteJob(id) {
  if (!confirm('Delete this job?')) return;
  try {
    await API.del('/api/jobs/' + id);
    toast('Deleted', 'success');
    loadJobs();
  } catch (err) {
    toast(err.message, 'error');
  }
}

loadJobs();
setInterval(() => loadJobs(), 4000);
// ─── Job details & reuse ─────────────────────────────────────────────────
// Field labels for the settings table. Anything not listed still shows, using
// its raw key — better to reveal an unknown setting than silently drop it.
const PARAM_LABELS = {
  model_type: 'Model', model: 'Model', resolution: 'Resolution', steps: 'Steps',
  guidance_scale: 'Guidance (CFG)', seed: 'Seed', duration_seconds: 'Duration (s)',
  fps: 'FPS', negative_prompt: 'Negative prompt', flow_shift: 'Flow shift',
  sample_solver: 'Sampler', repeat_generation: 'Repeats', control_type: 'Control type',
  control_strength: 'Control strength', video_length: 'Frames', embedded_guidance_scale: 'Embedded guidance',
};
const HIDE_PARAMS = new Set([
  'image_url', 'audio_url', 'video_url', 'end_image_url', 'control_video_url',
]);

function copyText(text, label) {
  navigator.clipboard.writeText(text)
    .then(() => toast((label || 'Copied') + ' to clipboard', 'success'))
    .catch(() => toast('Copy failed', 'error'));
}

function showDetails(id) {
  const j = JOBS.find(x => x.id === id);
  if (!j) return;
  const p = j.params || {};

  const rows = Object.entries(p)
    .filter(([k, v]) => !HIDE_PARAMS.has(k) && v !== null && v !== undefined && v !== '')
    .map(([k, v]) => `
      <div class="flex justify-between gap-4 py-2 border-b border-slate-100 dark:border-slate-800">
        <span class="text-slate-500 dark:text-slate-400">${escapeHtml(PARAM_LABELS[k] || k)}</span>
        <span class="font-mono text-right break-all">${escapeHtml(String(v))}</span>
      </div>`).join('');

  const media = [
    ['Input image', p.image_url], ['End image', p.end_image_url],
    ['Audio', p.audio_url], ['Input video', p.video_url],
    ['Driving video', p.control_video_url],
  ].filter(([, u]) => u).map(([label, u]) => `
      <div class="flex justify-between gap-4 py-2 border-b border-slate-100 dark:border-slate-800">
        <span class="text-slate-500 dark:text-slate-400">${label}</span>
        <a href="${u}" target="_blank" rel="noopener" class="text-brand underline truncate max-w-[16rem]">${escapeHtml(u.split('/').pop())}</a>
      </div>`).join('');

  document.getElementById('job-drawer-body').innerHTML = `
    <div class="flex items-start justify-between gap-4 mb-5">
      <div class="min-w-0">
        <h2 class="text-lg font-bold truncate">${escapeHtml(j.title || 'Job details')}</h2>
        <p class="text-xs text-slate-400 mt-0.5">${new Date(j.created_at).toLocaleString()} · ${escapeHtml(j.job_type || '')} · ${escapeHtml(j.mode || '')}</p>
      </div>
      <button onclick="closeDetails()" class="text-2xl leading-none text-slate-400 hover:text-slate-600">&times;</button>
    </div>

    ${j.result_url && j.status === 'completed' ? (
      /\.(mp4|webm|mov)$/i.test(j.result_url)
        ? `<video src="${j.result_url}" controls class="w-full rounded-xl bg-black mb-5"></video>`
        : `<img src="${j.result_url}" class="w-full rounded-xl mb-5" />`
    ) : ''}

    <div class="mb-5">
      <div class="flex items-center justify-between mb-1.5">
        <h3 class="text-xs uppercase tracking-wide text-slate-400">Prompt</h3>
        <button onclick="copyText(JOB_PROMPT, 'Prompt')" class="text-xs text-brand hover:underline">Copy</button>
      </div>
      <p class="text-sm whitespace-pre-wrap break-words p-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">${escapeHtml(j.prompt || '(none)')}</p>
    </div>

    ${p.negative_prompt ? `
    <div class="mb-5">
      <h3 class="text-xs uppercase tracking-wide text-slate-400 mb-1.5">Negative prompt</h3>
      <p class="text-sm whitespace-pre-wrap break-words p-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">${escapeHtml(p.negative_prompt)}</p>
    </div>` : ''}

    <h3 class="text-xs uppercase tracking-wide text-slate-400 mb-1">Settings</h3>
    <div class="text-sm mb-5">${rows || '<p class="text-slate-400 py-2">No stored settings.</p>'}</div>

    ${media ? `<h3 class="text-xs uppercase tracking-wide text-slate-400 mb-1">Input media</h3>
      <div class="text-sm mb-5">${media}</div>` : ''}

    ${j.error ? `<div class="mb-5 p-3 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900">
      <h3 class="text-xs uppercase tracking-wide text-red-500 mb-1">Error</h3>
      <p class="text-sm text-red-700 dark:text-red-300 break-words">${escapeHtml(j.error)}</p>
    </div>` : ''}

    <div class="flex flex-wrap gap-2">
      <button onclick="reuseJob('${j.id}')" class="flex-1 min-w-[8rem] px-4 py-2.5 rounded-xl bg-brand text-white font-semibold text-sm hover:opacity-90">Reuse settings</button>
      <button onclick="copyText(JSON.stringify({prompt: JOB_PROMPT, ...JOB_PARAMS}, null, 2), 'Settings')" class="px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 text-sm">Copy JSON</button>
      ${j.result_url ? `<a href="${j.result_url}" download class="px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 text-sm">Download</a>` : ''}
    </div>`;

  // Held separately so quotes/newlines in the prompt can't break the markup.
  window.JOB_PROMPT = j.prompt || '';
  window.JOB_PARAMS = p;
  document.getElementById('job-drawer').classList.remove('hidden');
}

function closeDetails() {
  document.getElementById('job-drawer').classList.add('hidden');
}

function reuseJob(id) {
  const j = JOBS.find(x => x.id === id);
  if (!j) return;
  // Handed to the Create page, which reads it once and clears it.
  sessionStorage.setItem('reuse_job', JSON.stringify({
    job_type: j.job_type,
    mode: j.mode,
    prompt: j.prompt || '',
    title: j.title || '',
    params: j.params || {},
  }));
  location.href = '/generate?reuse=' + encodeURIComponent(id);
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetails(); });

</script>
{% endblock %}
