{% extends "base.html" %}
{% block title %}Log in – {{ settings.app_name }}{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold">Welcome back</h1>
      <p class="text-slate-500 dark:text-slate-400 mt-1">Sign in to manage your generation jobs</p>
    </div>
    <form id="login-form" class="space-y-5 p-8 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xl">
      <div>
        <label class="block text-sm font-medium mb-1.5">Email</label>
        <input type="email" name="email" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-brand outline-none transition" placeholder="you@example.com" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5">Password</label>
        <input type="password" name="password" required minlength="6" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-brand outline-none transition" />
      </div>
      <button type="submit" class="w-full btn-brand py-2.5 rounded-xl font-semibold">Log in</button>
      <p class="text-center text-sm text-slate-500">No account? <a href="/register" class="text-brand font-medium hover:underline">Sign up</a></p>
      <p class="text-center text-xs text-slate-400">Default admin: admin@example.com / admin123</p>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const data = await API.post('/api/auth/login', {
      email: fd.get('email'),
      password: fd.get('password'),
    });
    setAuth(data.token, data.user);
    toast('Logged in', 'success');
    const next = new URLSearchParams(location.search).get('next') || '/generate';
    location.href = next;
  } catch (err) {
    toast(err.message || 'Login failed', 'error');
  }
});
</script>
{% endblock %}
