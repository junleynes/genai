{% extends "base.html" %}
{% block title %}Users – {{ settings.app_name }}{% endblock %}
{% block content %}
<div class="max-w-6xl mx-auto px-4 py-10">
  <a href="/admin" class="text-sm text-slate-500 hover:text-brand mb-4 inline-block">← Admin</a>
  <h1 class="text-3xl font-bold tracking-tight mb-8">Users</h1>
  <div id="users-table" class="overflow-x-auto rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
    <div class="p-8 text-center text-slate-400">Loading…</div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
if (!requireAdmin()) throw new Error('admin');

async function loadUsers() {
  const el = document.getElementById('users-table');
  try {
    const users = await API.get('/api/admin/users');
    el.innerHTML = `
      <table class="w-full text-sm">
        <thead class="bg-slate-50 dark:bg-slate-800/50 text-left">
          <tr>
            <th class="px-4 py-3 font-medium">Name</th>
            <th class="px-4 py-3 font-medium">Email</th>
            <th class="px-4 py-3 font-medium">Role</th>
            <th class="px-4 py-3 font-medium">Status</th>
            <th class="px-4 py-3 font-medium">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
          ${users.map(u => `
            <tr>
              <td class="px-4 py-3 font-medium">${escapeHtml(u.name)}</td>
              <td class="px-4 py-3 text-slate-500">${escapeHtml(u.email)}</td>
              <td class="px-4 py-3">
                <select data-id="${u.id}" data-field="role" class="role-sel px-2 py-1 rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent text-xs">
                  <option value="user" ${u.role==='user'?'selected':''}>user</option>
                  <option value="admin" ${u.role==='admin'?'selected':''}>admin</option>
                </select>
              </td>
              <td class="px-4 py-3">
                <span class="text-xs ${u.is_active ? 'text-emerald-600' : 'text-red-500'}">${u.is_active ? 'Active' : 'Disabled'}</span>
              </td>
              <td class="px-4 py-3">
                <button data-id="${u.id}" data-active="${u.is_active}" class="toggle-btn text-xs px-2 py-1 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800">
                  ${u.is_active ? 'Disable' : 'Enable'}
                </button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;

    el.querySelectorAll('.role-sel').forEach(sel => {
      sel.addEventListener('change', async () => {
        try {
          await API.patch('/api/admin/users/' + sel.dataset.id, { role: sel.value });
          toast('Role updated', 'success');
        } catch (e) { toast(e.message, 'error'); }
      });
    });
    el.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const next = btn.dataset.active !== 'true';
        try {
          await API.patch('/api/admin/users/' + btn.dataset.id, { is_active: next });
          toast(next ? 'Enabled' : 'Disabled', 'success');
          loadUsers();
        } catch (e) { toast(e.message, 'error'); }
      });
    });
  } catch (err) {
    el.innerHTML = `<p class="p-6 text-red-500">${escapeHtml(err.message)}</p>`;
  }
}
loadUsers();
</script>
{% endblock %}
