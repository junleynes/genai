{% extends "base.html" %}
{% block title %}Library – {{ settings.app_name }}{% endblock %}
{% block content %}
<div class="max-w-6xl mx-auto px-4 py-10">
  <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
    <div>
      <h1 class="text-3xl font-bold tracking-tight">Library</h1>
      <p class="text-slate-500 dark:text-slate-400 mt-1">Everything you've generated, ready to reuse</p>
    </div>
    <div class="flex items-center gap-2">
      <label class="btn-brand px-4 py-2 rounded-xl text-sm font-semibold cursor-pointer">
        Import file
        <input id="import-input" type="file" class="hidden"
               accept="image/*,video/*,audio/*" />
      </label>
      <a href="/generate" class="px-4 py-2 rounded-xl text-sm font-semibold border border-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800">New generation</a>
    </div>
  </div>

  <div id="stats" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6"></div>

  <div class="flex flex-wrap items-center gap-2 mb-6">
    <div class="flex rounded-xl border border-slate-300 dark:border-slate-700 overflow-hidden text-sm">
      <button data-filter="" class="filter-btn px-3 py-1.5">All</button>
      <button data-filter="image" class="filter-btn px-3 py-1.5 border-l border-slate-300 dark:border-slate-700">Images</button>
      <button data-filter="video" class="filter-btn px-3 py-1.5 border-l border-slate-300 dark:border-slate-700">Videos</button>
      <button data-filter="fav" class="filter-btn px-3 py-1.5 border-l border-slate-300 dark:border-slate-700">★ Favorites</button>
    </div>
    <input id="search" type="search" placeholder="Search prompts, titles, tags…"
      class="flex-1 min-w-[200px] px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm" />
  </div>

  <div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    <p class="text-slate-500 col-span-full">Loading…</p>
  </div>
</div>

<!-- Detail drawer -->
<div id="drawer" class="hidden fixed inset-0 z-50">
  <div class="absolute inset-0 bg-black/60" onclick="closeDrawer()"></div>
  <div class="absolute right-0 inset-y-0 w-full max-w-md bg-white dark:bg-slate-900 shadow-xl overflow-y-auto">
    <div id="drawer-body" class="p-5"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
if (!requireAuth()) throw new Error('auth');

let ITEMS = [];
let FILTER = '';
let SEARCH = '';
const PAGE_SIZE = 48;
let HAS_MORE = false;
let LOADING = false;
let GEN = 0;          // bumps on every filter/search change so stale responses are dropped

function qs(params) {
  const p = new URLSearchParams();
  if (params.media_type) p.set('media_type', params.media_type);
  if (params.favorites) p.set('favorites', 'true');
  if (params.search) p.set('search', params.search);
  p.set('limit', PAGE_SIZE);
  p.set('offset', params.offset || 0);
  return '?' + p.toString();
}

function statCard(label, value) {
  return `<div class="rounded-xl border border-slate-200 dark:border-slate-800 p-3">
    <div class="text-2xl font-bold">${value}</div>
    <div class="text-xs text-slate-500 dark:text-slate-400">${label}</div>
  </div>`;
}

// The file behind a library item can disappear from the server (cleanup,
// moved outputs). Show a quiet placeholder instead of a broken image.
function mediaMissing(el) {
  const d = document.createElement('div');
  d.className = 'hf-media-missing';
  d.textContent = 'File unavailable';
  el.replaceWith(d);
}

// Thumbnail failed (no ffmpeg/Pillow, or file gone). Images fall back to the
// original; videos get a neutral placeholder rather than a broken icon.
function thumbFailed(img, id) {
  const it = ITEMS.find(x => x.id === id);
  if (it && it.media_type === 'image' && img.dataset.fallback !== '1') {
    img.dataset.fallback = '1';
    img.src = it.url;
  } else if (it && it.media_type === 'video') {
    const d = document.createElement('div');
    d.className = 'w-full h-40 flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-4xl';
    d.textContent = '🎬';
    img.replaceWith(d);
  } else {
    mediaMissing(img);
  }
}

// Videos only download when hovered: the grid shows a cheap JPEG poster and
// swaps in a <video> on mouseenter.
function hoverPlay(box, id) {
  const it = ITEMS.find(x => x.id === id);
  if (!it || it.media_type !== 'video' || box.querySelector('video')) return;
  const v = document.createElement('video');
  v.src = it.url;
  v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
  v.className = 'absolute inset-0 w-full h-40 object-cover bg-black pointer-events-none';
  v.onerror = () => v.remove();
  box.appendChild(v);
  v.play().catch(() => v.remove());
}
function hoverStop(box) { box.querySelector('video')?.remove(); }

function tile(it) {
  const media = it.media_type === 'audio'
    ? `<div class="w-full h-40 flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-4xl">🎵</div>`
    : `<img src="${it.thumb_url || it.url}" loading="lazy" decoding="async"
            class="w-full h-40 object-cover bg-slate-50 dark:bg-slate-950"
            onerror="thumbFailed(this,'${it.id}')" />`;
  const hover = it.media_type === 'video'
    ? `onmouseenter="hoverPlay(this,'${it.id}')" onmouseleave="hoverStop(this)"` : '';
  return `<div class="group rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden hover:shadow-lg transition" data-id="${it.id}">
    <div class="relative cursor-pointer" onclick="openDrawer('${it.id}')" ${hover}>
      ${media}
      ${it.media_type === 'video' ? '<span class="absolute bottom-2 left-2 text-[10px] px-1.5 py-0.5 rounded bg-black/50 text-white pointer-events-none">▶</span>' : ''}
      <button onclick="event.stopPropagation();toggleFav('${it.id}')"
        class="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/50 text-white text-sm leading-none
               ${it.favorite ? '' : 'opacity-0 group-hover:opacity-100'} transition">
        ${it.favorite ? '★' : '☆'}
      </button>
      ${it.source === 'uploaded' ? '<span class="absolute top-2 left-2 text-[10px] px-1.5 py-0.5 rounded bg-black/50 text-white">imported</span>' : ''}
    </div>
    <div class="p-2.5">
      <p class="text-xs font-medium truncate" title="${escapeHtml(it.title || '')}">${escapeHtml(it.title || 'Untitled')}</p>
      <p class="text-[10px] text-slate-500 truncate">${new Date(it.created_at).toLocaleDateString()}</p>
      <div class="flex gap-1 mt-2">
        <button onclick="useIn('${it.id}')" class="flex-1 text-[11px] px-2 py-1 rounded-lg btn-brand font-semibold">Use</button>
        <a href="${it.url}" download class="text-[11px] px-2 py-1 rounded-lg border border-slate-300 dark:border-slate-700">↓</a>
      </div>
    </div>
  </div>`;
}

const EMPTY_HTML = `<div class="col-span-full text-center py-16 text-slate-500">
  <p class="text-4xl mb-3">🗂️</p>
  <p>Nothing here yet. Generated media lands here automatically.</p>
</div>`;

// reset=true starts over (filter/search/import); otherwise appends the next page.
async function load(reset = true) {
  const grid = document.getElementById('grid');
  if (reset) { GEN++; ITEMS = []; HAS_MORE = false; LOADING = false; }
  if (LOADING) return;
  LOADING = true;
  const gen = GEN;
  try {
    const params = FILTER === 'fav'
      ? { favorites: true, search: SEARCH }
      : { media_type: FILTER, search: SEARCH };
    params.offset = ITEMS.length;
    const data = await API.get('/api/library' + qs(params));
    if (gen !== GEN) return;           // superseded by a newer filter/search
    const page = data.items || [];
    HAS_MORE = !!data.has_more;
    if (data.stats) {
      const s = data.stats;
      document.getElementById('stats').innerHTML =
        statCard('Total', s.total || 0) + statCard('Images', s.images || 0) +
        statCard('Videos', s.videos || 0) + statCard('Favorites', s.favorites || 0);
    }
    if (reset) grid.innerHTML = '';
    ITEMS = ITEMS.concat(page);
    if (!ITEMS.length) grid.innerHTML = EMPTY_HTML;
    else grid.insertAdjacentHTML('beforeend', page.map(tile).join(''));
  } catch (e) {
    if (gen === GEN && reset) {
      grid.innerHTML = `<p class="text-red-500 col-span-full">${escapeHtml(e.message || 'Failed to load')}</p>`;
    } else if (gen === GEN) {
      toast(e.message || 'Failed to load more', 'error');
    }
  } finally {
    if (gen === GEN) LOADING = false;
    // The sentinel may still be on screen after a short page; check again.
    if (gen === GEN && HAS_MORE) requestAnimationFrame(maybeLoadMore);
  }
}

// Infinite scroll
const sentinel = document.createElement('div');
sentinel.id = 'sentinel'; sentinel.style.height = '1px';
document.getElementById('grid').after(sentinel);
function maybeLoadMore() {
  if (!HAS_MORE || LOADING) return;
  if (sentinel.getBoundingClientRect().top < window.innerHeight + 600) load(false);
}
new IntersectionObserver((e) => { if (e[0].isIntersecting) maybeLoadMore(); },
  { rootMargin: '600px' }).observe(sentinel);

async function refreshStats() {
  try {
    const d = await API.get('/api/library?limit=1&offset=0');
    const s = d.stats; if (!s) return;
    document.getElementById('stats').innerHTML =
      statCard('Total', s.total || 0) + statCard('Images', s.images || 0) +
      statCard('Videos', s.videos || 0) + statCard('Favorites', s.favorites || 0);
  } catch (e) { /* stats are cosmetic */ }
}

// Re-render one tile in place (favorite toggle) instead of refetching the list.
function rerenderTile(it) {
  const el = document.querySelector(`#grid [data-id="${it.id}"]`);
  if (el) el.outerHTML = tile(it);
}

async function toggleFav(id) {
  const it = ITEMS.find(x => x.id === id);
  if (!it) return;
  try {
    await API.patch('/api/library/' + id, { favorite: !it.favorite });
    it.favorite = !it.favorite;
    if (FILTER === 'fav') load(); else { rerenderTile(it); refreshStats(); }
  } catch (e) { toast(e.message || 'Failed', 'error'); }
}

async function removeItem(id) {
  if (!confirm('Remove from library? The file will be deleted.')) return;
  try {
    await API.del('/api/library/' + id);
    closeDrawer();
    toast('Removed', 'success');
    load();
  } catch (e) { toast(e.message || 'Failed', 'error'); }
}

function useIn(id) {
  const it = ITEMS.find(x => x.id === id);
  if (!it) return;
  // Generate page reads these and preloads the input.
  sessionStorage.setItem('library_seed', JSON.stringify({
    id: it.id, url: it.url, media_type: it.media_type, title: it.title,
  }));
  location.href = '/generate?from_library=' + encodeURIComponent(it.id);
}

function openDrawer(id) {
  const it = ITEMS.find(x => x.id === id);
  if (!it) return;
  const p = it.params || {};
  const rows = Object.entries(p).filter(([, v]) => v !== null && v !== '')
    .map(([k, v]) => `<div class="flex justify-between gap-3 py-1 border-b border-slate-100 dark:border-slate-800">
        <span class="text-slate-500">${escapeHtml(k)}</span>
        <span class="font-mono text-right">${escapeHtml(String(v))}</span></div>`).join('');
  const preview = it.media_type === 'video'
    ? `<video src="${it.url}" controls class="w-full rounded-xl bg-black"></video>`
    : it.media_type === 'audio'
      ? `<audio src="${it.url}" controls class="w-full"></audio>`
      : `<img src="${it.url}" class="w-full rounded-xl" />`;
  document.getElementById('drawer-body').innerHTML = `
    <div class="flex justify-between items-start mb-4">
      <h2 class="text-lg font-bold pr-4">${escapeHtml(it.title || 'Untitled')}</h2>
      <button onclick="closeDrawer()" class="text-2xl leading-none text-slate-400 hover:text-slate-600">×</button>
    </div>
    ${preview}
    ${it.prompt ? `<div class="mt-4">
      <p class="text-xs uppercase tracking-wide text-slate-400 mb-1">Prompt</p>
      <p class="text-sm">${escapeHtml(it.prompt)}</p></div>` : ''}
    ${it.model ? `<p class="text-xs text-slate-500 mt-3">Model: <span class="font-mono">${escapeHtml(it.model)}</span></p>` : ''}
    ${rows ? `<div class="mt-4 text-xs">${rows}</div>` : ''}
    <div class="flex gap-2 mt-5">
      <button onclick="useIn('${it.id}')" class="flex-1 btn-brand px-3 py-2 rounded-xl text-sm font-semibold">Use in generation</button>
      <a href="${it.url}" download class="px-3 py-2 rounded-xl text-sm border border-slate-300 dark:border-slate-700">Download</a>
    </div>
    <button onclick="removeItem('${it.id}')" class="w-full mt-2 px-3 py-2 rounded-xl text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-950">Remove</button>`;
  document.getElementById('drawer').classList.remove('hidden');
}
function closeDrawer() { document.getElementById('drawer').classList.add('hidden'); }

document.querySelectorAll('.filter-btn').forEach(b => {
  b.addEventListener('click', () => {
    FILTER = b.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(x =>
      x.classList.toggle('btn-brand', x.dataset.filter === FILTER));
    load();
  });
});

let searchTimer;
document.getElementById('search').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { SEARCH = e.target.value.trim(); load(); }, 250);
});

document.getElementById('import-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  try {
    await API.postForm('/api/library/import', fd);
    toast('Imported', 'success');
    load();
  } catch (err) { toast(err.message || 'Import failed', 'error'); }
  e.target.value = '';
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

document.querySelector('.filter-btn').classList.add('btn-brand');
load();
</script>
{% endblock %}
