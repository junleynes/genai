<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ settings.app_name }}{% endblock %}</title>
  {% if settings.favicon_url %}
  <link rel="icon" href="{{ settings.favicon_url }}" />
  {% endif %}
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '{{ settings.primary_color }}',
              secondary: '{{ settings.secondary_color }}',
              accent: '{{ settings.accent_color }}',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: {{ settings.primary_color }};
      --brand-secondary: {{ settings.secondary_color }};
      --brand-accent: {{ settings.accent_color }};
    }
    body { font-family: 'Inter', system-ui, sans-serif; }
    .bg-brand { background-color: var(--brand); }
    .text-brand { color: var(--brand); }
    .border-brand { border-color: var(--brand); }
    .ring-brand { --tw-ring-color: var(--brand); }
    .btn-brand {
      background: linear-gradient(135deg, var(--brand), var(--brand-secondary));
      color: white;
    }
    .btn-brand:hover { filter: brightness(1.08); }
    .glass {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(12px);
    }
    .dark .glass {
      background: rgba(15,23,42,0.75);
    }
    .progress-bar { transition: width 0.4s ease; }
    .sidebar-link.active {
      background: color-mix(in srgb, var(--brand) 15%, transparent);
      color: var(--brand);
      font-weight: 600;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
  <div id="app" class="min-h-full flex">
    <!-- Sidebar -->
    <aside id="sidebar" class="hidden fixed inset-y-0 left-0 z-40 w-64 flex-col border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 md:flex">
      <div class="h-16 flex items-center gap-2.5 px-4 border-b border-slate-200 dark:border-slate-800">
        <a href="/" class="flex items-center gap-2.5 min-w-0">
          {% if settings.logo_url %}
          <img src="{{ settings.logo_url }}" alt="Logo" class="h-8 w-auto rounded shrink-0" />
          {% else %}
          <div class="h-9 w-9 rounded-xl btn-brand flex items-center justify-center shadow-lg shadow-indigo-500/25 shrink-0">
            <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          </div>
          {% endif %}
          <div class="min-w-0">
            <span class="font-semibold text-sm tracking-tight block truncate">{{ settings.app_name }}</span>
            <p class="text-[10px] text-slate-500 dark:text-slate-400 truncate">{{ settings.tagline }}</p>
          </div>
        </a>
      </div>
      <nav id="sidebar-nav" class="flex-1 overflow-y-auto p-3 space-y-1 text-sm">
        <!-- filled by JS -->
      </nav>
      <div class="p-3 border-t border-slate-200 dark:border-slate-800 space-y-2">
        <button id="theme-toggle" type="button" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition text-sm">
          <svg id="icon-sun" class="w-4 h-4 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg id="icon-moon" class="w-4 h-4 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          <span>Theme</span>
        </button>
        <div id="sidebar-auth" class="text-sm"></div>
      </div>
    </aside>

    <!-- Mobile overlay -->
    <div id="sidebar-overlay" class="hidden fixed inset-0 z-30 bg-black/40 md:hidden"></div>

    <!-- Main column -->
    <div id="main-column" class="flex-1 flex flex-col min-w-0 min-h-full md:pl-64">
      <!-- Top bar (mobile + public) -->
      <header class="sticky top-0 z-20 border-b border-slate-200/80 dark:border-slate-800 glass">
        <div class="flex h-14 items-center justify-between gap-3 px-4">
          <div class="flex items-center gap-2">
            <button id="sidebar-open" type="button" class="md:hidden p-2 rounded-lg hover:bg-slate-200/70 dark:hover:bg-slate-800" aria-label="Menu">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <a href="/" class="md:hidden font-semibold text-sm truncate max-w-[12rem]">{{ settings.app_name }}</a>
            <span id="page-title-hint" class="hidden md:inline text-sm text-slate-500 dark:text-slate-400"></span>
          </div>
          <div class="flex items-center gap-2">
            <button id="theme-toggle-top" type="button" class="md:hidden p-2 rounded-lg hover:bg-slate-200/70 dark:hover:bg-slate-800" title="Toggle theme">
              <svg class="w-5 h-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
              <svg class="w-5 h-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            </button>
            <div id="auth-area" class="flex items-center gap-2"></div>
          </div>
        </div>
      </header>

      <main class="flex-1">
        {% block content %}{% endblock %}
      </main>

      <footer class="border-t border-slate-200 dark:border-slate-800 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-slate-500 dark:text-slate-400">
          {{ settings.footer }}
        </div>
      </footer>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
